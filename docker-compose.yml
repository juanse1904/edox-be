services:
  db:
    image: postgres:16
    container_name: edox-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: edox_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailhog:
    image: mailhog/mailhog
    container_name: edox-mailhog
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres_data:
